name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[subdoc]" pytest
      - name: Unit tests
        run: python -m pytest

  examples:
    name: Example scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[subdoc]"
      - name: Render the invoice example
        if: hashFiles('examples/invoice/render.py') != ''
        run: python examples/invoice/render.py
      - name: Run the feature scripts in tests/
        working-directory: tests
        run: |
          mkdir -p output
          failed=0
          for f in [A-Za-z]*.py; do
            [ "$f" = runtests.py ] && continue
            echo "::group::$f"
            python "$f" || { echo "::error::$f failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check what's in the package
        run: |
          python -m zipfile -l dist/*.whl
          tar tzf dist/*.tar.gz
          python -m zipfile -l dist/*.whl | grep -q "docform/docx/template.py"
          python -m zipfile -l dist/*.whl | grep -qi "license"
          tar tzf dist/*.tar.gz | grep -qi "license"
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import docform, docform.docx; print(docform.__version__)"
