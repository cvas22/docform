[project]
name = "docform"
dynamic = ["version"]
description = "Fill document templates with data using Jinja2"
authors = [{name="Srinivas Chippagiri"}, {name="Eric Lapouyade", email="elapouya@proton.me"}]
maintainers = [{name="Srinivas Chippagiri"}]
readme = "README.md"
requires-python = ">=3.7"
license = {text="LGPL-2.1-only"}
classifiers=[
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["jinja2", "docx", "word", "template", "document generation"]
dependencies = [
    "python-docx",
    "jinja2",
    "lxml",
]

[project.optional-dependencies]
subdoc = ["docxcompose"]
docs = ["Sphinx", "sphinxcontrib-napoleon"]

[dependency-groups]
dev = [
    "mypy >=1.18.2; python_version >= '3.9'",
    "lxml-stubs >=0.5.1; python_version >= '3.9'",
    "flake8 >=7.3.0; python_version >= '3.9'",
    "pytest >=7",
    "docxcompose",
]

[project.urls]
homepage = "https://github.com/cvas22/docform"
repository = "https://github.com/cvas22/docform.git"

[tool.poetry]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry-dynamic-versioning.from-file]
source = "docform/__init__.py"
pattern = '__version__ = "(.+)"'

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
pretty = true
python_version = "3.9"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["docs", "build", "setup.py"]

[[tool.mypy.overrides]]
module = ["docxcompose.*"]
ignore_missing_imports = true

[tool.pdm]
version = {source="file", path="docform/__init__.py"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
