[project]
name = "docform"
dynamic = ["version"]
description = "Fill document templates with data using Jinja2"
authors = [{name="Srinivas Chippagiri", email="cvas22@gmail.com"}]
maintainers = [{name="Srinivas Chippagiri", email="cvas22@gmail.com"}]
readme = "README.md"
requires-python = ">=3.7"
license = {text="LGPL-2.1-only"}
classifiers=[
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["jinja2", "docx", "word", "template", "document generation"]
dependencies = [
    "python-docx",
    "jinja2",
    "lxml",
]

[project.optional-dependencies]
subdoc = ["docxcompose"]
docs = ["Sphinx", "sphinxcontrib-napoleon"]

[dependency-groups]
dev = [
    "mypy >=1.18.2; python_version >= '3.9'",
    "lxml-stubs >=0.5.1; python_version >= '3.9'",
    "flake8 >=7.3.0; python_version >= '3.9'",
    "pytest >=7",
    "docxcompose",
]

[project.urls]
Homepage = "https://github.com/cvas22/docform"
Repository = "https://github.com/cvas22/docform"
Issues = "https://github.com/cvas22/docform/issues"
Changelog = "https://github.com/cvas22/docform/blob/main/CHANGES.rst"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
pretty = true
python_version = "3.9"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["docs", "build"]

[[tool.mypy.overrides]]
module = ["docxcompose.*"]
ignore_missing_imports = true

[tool.pdm]
version = {source="file", path="docform/__init__.py"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
